name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Smoke test server start
        run: |
          PORT=3000 npm start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
